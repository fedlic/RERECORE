openapi: 3.1.0
info:
  title: RECORE OSS API
  version: 0.1.0
  description: |
    RECOREライクなリユース業向け在庫・仕入・販売APIの最小定義。
servers:
  - url: https://api.example.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /items:
    post:
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
    get:
      summary: Search items
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /items/{id}:
    get:
      summary: Get item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Not Found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
  /movements:
    post:
      summary: Create inventory movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
  /purchases:
    post:
      summary: Create purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
  /sales:
    post:
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
components:
  headers:
    RequestId:
      description: Request correlation ID generated by the API.
      schema:
        type: string
        example: req_01JY7MZ3B7KQ2V2QW2XG5G6R7H
  schemas:
    Item:
      type: object
      required: [id, sku, name, condition, purchase_price, sale_price, status]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        jan:
          type: string
          nullable: true
        name:
          type: string
        condition:
          type: string
          enum: [new, used-a, used-b, junk]
        purchase_price:
          type: number
        sale_price:
          type: number
        status:
          type: string
          enum: [draft, in_stock, sold, returned, archived]
    ItemCreate:
      type: object
      required: [sku, name, condition, purchase_price, sale_price]
      properties:
        sku:
          type: string
        jan:
          type: string
          nullable: true
        name:
          type: string
        condition:
          type: string
          enum: [new, used-a, used-b, junk]
        purchase_price:
          type: number
        sale_price:
          type: number
    InventoryMovement:
      type: object
      required: [id, item_id, from_location, to_location, moved_at, moved_by]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        from_location:
          type: string
        to_location:
          type: string
        moved_at:
          type: string
          format: date-time
        moved_by:
          type: string
    InventoryMovementCreate:
      type: object
      required: [item_id, from_location, to_location, moved_by]
      properties:
        item_id:
          type: string
          format: uuid
        from_location:
          type: string
        to_location:
          type: string
        moved_by:
          type: string
    Purchase:
      type: object
      required: [id, supplier_name, purchased_at, lines]
      properties:
        id:
          type: string
          format: uuid
        supplier_name:
          type: string
        purchased_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseLine'
    PurchaseCreate:
      type: object
      required: [supplier_name, lines]
      properties:
        supplier_name:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseLineCreate'
    PurchaseLine:
      type: object
      required: [item_id, quantity, unit_price]
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
    PurchaseLineCreate:
      type: object
      required: [item_id, quantity, unit_price]
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
    Sale:
      type: object
      required: [id, sold_at, total_amount, lines]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
          nullable: true
        sold_at:
          type: string
          format: date-time
        total_amount:
          type: number
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
    SaleCreate:
      type: object
      required: [lines]
      properties:
        customer_id:
          type: string
          format: uuid
          nullable: true
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleLineCreate'
    SaleLine:
      type: object
      required: [item_id, quantity, unit_price]
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
    SaleLineCreate:
      type: object
      required: [item_id, quantity, unit_price]
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          minimum: 0
